[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketlens-analytics"
version = "0.1.0"
description = "Evidence-backed event indexing and product analytics for MarketLens"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.3,<3",
  "web3>=7.13,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
marketlens = "marketlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

